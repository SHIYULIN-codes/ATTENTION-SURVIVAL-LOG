# File Overview
# Defines the primary Render deployment for the project's shared ecological experience.

services:
  - type: web
    name: attention-ecology-shared
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attention-ecology-db
          property: connectionString
      - key: ECOLOGY_ADMIN_TOKEN
        generateValue: true

databases:
  - name: attention-ecology-db
    plan: free
    postgresMajorVersion: "18"
